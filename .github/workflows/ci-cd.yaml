name: Build and Push Docker Image to ECR

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Push to ECR and Deploy to ECS
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tag
        id: vars
        run: |
          echo "IMAGE_TAG=latest" >> $GITHUB_ENV

      - name: Build, Tag and Push Docker Image
        run: |
          IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:$IMAGE_TAG
          
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Deploy to ECS
        run: |
          CLUSTER_NAME=${{ secrets.ECS_CLUSTER }}
          SERVICE_NAME=${{ secrets.ECS_SERVICE }}
          TASK_DEFINITION_ARN=${{ secrets.ECS_TASK_DEFINITION }}

          # Update ECS Service with the existing Task Definition
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --task-definition $TASK_DEFINITION_ARN

      - name: Deployment Successful 🎉
        run: |
          ALB_URL="http://${{ secrets.ALB_DNS_NAME }}"
          echo "🎉 Congratulations! The site is deployed successfully 🎉"
          echo "URL: $ALB_URL"
          echo "Deployed to ECS and ALB URL: $ALB_URL" >> $GITHUB_ENV
